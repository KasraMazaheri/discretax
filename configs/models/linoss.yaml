model:
  name: linoss
  hidden_dim: 64
  encoder:
    target: LinearEncoder
    kwargs:
      use_bias: false
  backbone:
    target: LinOSS
    kwargs:
      num_blocks: 4
      state_dim: 64
      num_heads: 1
      use_head_gating: false
      use_head_output_projection: false
      drop_rate: 0.1
      prenorm: true
      discretization: IMEX
      initialization: AG
      r_min: 0.9
      theta_max: 3.14159
      A_max: 1.0
      G_max: 1.0
  head:
    target: ClassificationHead
    kwargs:
      reduce: true
