model:
  name: s5
  hidden_dim: 64
  encoder:
    target: LinearEncoder
    kwargs:
      use_bias: false
  backbone:
    target: S5
    kwargs:
      num_blocks: 4
      state_dim: 64
      ssm_blocks: 1
      drop_rate: 0.1
      prenorm: true
  head:
    target: ClassificationHead
    kwargs:
      reduce: true
