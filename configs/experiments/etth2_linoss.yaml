defaults:
  - ../base
  - ../datasets/etth2
  - ../models/linoss

name: linoss-etth2
seed: 0
description: LinOSS on the ETTh2 long-horizon multivariate forecasting task.
tags:
  - linoss
  - etth2
model:
  backbone:
    kwargs:
      A_max: 4.0
      G_max: 0.8
  head:
    target: RegressionHead
    kwargs:
      reduce: false
      output_step: 1
wandb:
  enabled: false
  project: discretax-linoss-ltsf
  job_type: train
  tags:
    - LinOSS
    - ETTh2
    - regression
