defaults:
  - ../base
  - ../datasets/cifar10
  - ../models/deltanet

name: cifar10-deltanet-baseline
description: Baseline DeltaNet training run on CIFAR-10 with offline W&B logging.
tags:
  - baseline
  - cifar10
  - deltanet
loader:
  batch_size: 64
  eval_batch_size: 128
optimizer:
  name: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  schedule:
    name: warmup_cosine_decay
    warmup_steps: 10
    decay_steps: 50
    end_value: 0.00005
trainer:
  seed: 1
  num_epochs: 1
  max_steps: 50
  log_every_steps: 10
  eval_every_steps: 25
  checkpoint_every_steps: 50
wandb:
  enabled: true
  mode: offline
  project: discretax-baselines
  job_type: train
  tags:
    - baseline
    - offline
