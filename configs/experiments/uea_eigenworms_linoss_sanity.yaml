defaults:
  - ../base
  - ../datasets/uea
  - ../models/linoss

name: uea-eigenworms-linoss-sanity
description: Longer LinOSS sanity-check experiment for the processed EigenWorms UEA dataset.
tags:
  - sanity
  - uea
  - eigenworms
  - linoss
paths:
  data_root: data
  output_root: outputs
loader:
  batch_size: 2
  eval_batch_size: 4
optimizer:
  name: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  schedule:
    name: warmup_cosine_decay
    warmup_steps: 5
    decay_steps: 30
    end_value: 0.00003
model:
  name: linoss
  hidden_dim: 32
  backbone:
    target: LinOSS
    kwargs:
      num_blocks: 2
      state_dim: 64
      drop_rate: 0.0
      prenorm: true
      discretization: IMEX
      damping: true
  head:
    target: ClassificationHead
    kwargs:
      reduce: true
trainer:
  seed: 0
  num_epochs: 1
  max_steps: 30
  log_every_steps: 1
  eval_every_steps: 5
  checkpoint_every_steps: 10
wandb:
  enabled: true
  mode: offline
  project: discretax-uea
  job_type: train
  tags:
    - sanity
    - offline
