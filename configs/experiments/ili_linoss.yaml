defaults:
  - ../base
  - ../datasets/ili
  - ../models/linoss

name: linoss-ili
seed: 0
description: LinOSS on the ILI (national_illness) long-horizon multivariate forecasting task.
tags:
  - linoss
  - ili
loader:
  batch_size: 4
  eval_batch_size: 4
model:
  backbone:
    kwargs:
      A_max: 4.0
      G_max: 3.0
  head:
    target: RegressionHead
    kwargs:
      reduce: false
      output_step: 1
wandb:
  enabled: false
  project: discretax-linoss-ltsf
  job_type: train
  tags:
    - LinOSS
    - ILI
    - regression
