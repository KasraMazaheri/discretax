defaults:
  - ../base
  - ../datasets/etth1
  - ../models/linoss

name: linoss-etth1
seed: 0
description: LinOSS on the ETTh1 long-horizon multivariate forecasting task.
tags:
  - linoss
  - etth1
model:
  backbone:
    kwargs:
      A_max: 4.0
      G_max: 3.0
  head:
    target: RegressionHead
    kwargs:
      reduce: false
      output_step: 1
wandb:
  enabled: false
  project: discretax-linoss-ltsf
  job_type: train
  tags:
    - LinOSS
    - ETTh1
    - regression
