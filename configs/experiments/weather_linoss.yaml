defaults:
  - ../base
  - ../datasets/weather
  - ../models/linoss

name: linoss-weather
seed: 0
description: LinOSS on the Weather long-horizon multivariate forecasting task.
tags:
  - linoss
  - weather
loader:
  batch_size: 4
  eval_batch_size: 4
model:
  head:
    target: RegressionHead
    kwargs:
      reduce: false
      output_step: 1
trainer:
  num_epochs: 100
wandb:
  enabled: true
  mode: online
  project: discretax-linoss-weather
  job_type: train
  tags:
    - LinOSS
    - Weather
    - regression
    - online
