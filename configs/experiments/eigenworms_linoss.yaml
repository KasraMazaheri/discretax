defaults:
  - ../base
  - ../datasets/uea
  - ../models/linoss

name: linoss-uea-eigenworms
seed: 0
description: Base LinOSS experiment on the UEA EigenWorms classification dataset.
tags:
  - linoss
  - uea
  - eigenworms
paths:
  data_root: data
  output_root: outputs
loader:
  batch_size: 32
  eval_batch_size: 32
optimizer:
  name: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  schedule:
    name: constant
model:
  backbone:
    kwargs:
      A_max: 1.0
      G_max: 0.25
trainer:
  num_epochs: 1000
  max_steps: 100000
  log_every_steps: 100
  eval_every_steps: 1000
  checkpoint_every_steps: 10000
wandb:
  enabled: true
  mode: online
  project: discretax-uea-eigenworms
  job_type: train
  tags:
    - linoss
    - uea
    - eigenworms
    - classification
    - online
