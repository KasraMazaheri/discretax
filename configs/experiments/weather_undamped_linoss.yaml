defaults:
  - ../base
  - ../datasets/weather
  - ../models/undamped_linoss

name: linoss-weather
seed: 0
description: LinOSS on the Weather long-horizon multivariate forecasting task.
tags:
  - linoss
  - weather
model:
  head:
    target: RegressionHead
    kwargs:
      reduce: false
      output_step: 1
wandb:
  enabled: true
  mode: online
  project: discretax-linoss-weather
  job_type: train
  tags:
    - LinOSS
    - Weather
    - regression
    - online
