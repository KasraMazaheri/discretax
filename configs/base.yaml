name: base-experiment
description: Base experiment settings for Discretax training runs.
tags: []
seed: 0
paths:
  data_root: data
  output_root: outputs
loader:
  batch_size: 32
  eval_batch_size: 32
  shuffle_train: true
  drop_last_train: true
optimizer:
  name: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  # grad_clip_norm: 1.0
  # eps: 0.00000001
  schedule:
    name: constant
trainer:
  max_steps: 100000
  log_every_steps: 100
  eval_every_steps: 1000
  checkpoint_every_steps: 10000
  early_stopping_patience: 10
  jit: true
precision:
  mode: float32
checkpoint:
  enabled: true
  save_best: true
  monitor: val_loss
  mode: min
wandb:
  enabled: false
  project: discretax
  tags: []
