base_config: configs/experiments/uea_linoss_regime_base.yaml

run_name:
  prefix: discretax_uea_eigenworms_linoss_regime_map_imex
  include_keys:
    - trainer.seed
    - model.hidden_dim
    - model.backbone.kwargs.state_dim
    - model.backbone.kwargs.num_heads
    - model.backbone.kwargs.use_head_output_projection

fixed:
  name: discretax_uea_eigenworms_linoss_regime_map_imex
  dataset.name: EigenWorms
  model.backbone.kwargs.discretization: IMEX
  model.backbone.kwargs.initialization: AG
  model.backbone.kwargs.damping: true
  model.backbone.kwargs.stability: stable
  model.backbone.kwargs.A_max: 16.0
  model.backbone.kwargs.G_max: 8.0
  model.backbone.kwargs.r_min: 0.9
  model.backbone.kwargs.theta_max: 3.141592653589793
  model.backbone.kwargs.use_head_gating: false
  wandb.enabled: true
  wandb.mode: online
  wandb.project: discretax
  wandb.group: discretax_uea_eigenworms_linoss_regime_map
  wandb.job_type: train
  wandb.tags:
    - LinOSS
    - UEA
    - EigenWorms
    - regime-map
    - family-imex
    - primary-uea
    - ag-init
    - stable-projection
    - amax16
    - gmax8

grid:
  trainer.seed:
    - 0
    - 1
    - 2
    - 3
  model.hidden_dim:
    - 256
    - 512
    - 1024
  model.backbone.kwargs.state_dim:
    - 256
    - 512
    - 1024
  model.backbone.kwargs.num_heads:
    - 1
    - 8
  model.backbone.kwargs.use_head_output_projection:
    - false
    - true

exclude:
  - model.backbone.kwargs.num_heads: 1
    model.backbone.kwargs.use_head_output_projection: true

