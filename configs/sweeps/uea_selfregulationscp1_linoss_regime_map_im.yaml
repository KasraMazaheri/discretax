base_config: configs/experiments/uea_linoss_regime_base.yaml

run_name:
  prefix: discretax_uea_selfregulationscp1_linoss_regime_map_im
  include_keys:
    - trainer.seed
    - model.hidden_dim
    - model.backbone.kwargs.state_dim
    - model.backbone.kwargs.num_heads
    - model.backbone.kwargs.use_head_output_projection

fixed:
  name: discretax_uea_selfregulationscp1_linoss_regime_map_im
  dataset.name: SelfRegulationSCP1
  model.backbone.kwargs.discretization: IM
  model.backbone.kwargs.damping: false
  model.backbone.kwargs.r_min: 0.9
  model.backbone.kwargs.theta_max: 3.141592653589793
  model.backbone.kwargs.use_head_gating: false
  wandb.enabled: true
  wandb.mode: online
  wandb.project: discretax
  wandb.group: discretax_uea_selfregulationscp1_linoss_regime_map
  wandb.job_type: train
  wandb.tags:
    - LinOSS
    - UEA
    - SelfRegulationSCP1
    - regime-map
    - family-im
    - primary-uea

grid:
  trainer.seed:
    - 0
    - 1
    - 2
    - 3
  model.hidden_dim:
    - 256
    - 512
    - 1024
  model.backbone.kwargs.state_dim:
    - 256
    - 512
    - 1024
  model.backbone.kwargs.num_heads:
    - 1
    - 8
  model.backbone.kwargs.use_head_output_projection:
    - false
    - true

exclude:
  - model.backbone.kwargs.num_heads: 1
    model.backbone.kwargs.use_head_output_projection: true

